<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f9; --surface: #ffffff; --text: #1a1d23; --muted: #6b7280;
      --border: #e3e6eb; --accent: #2563eb; --accent-fg: #fff; --danger: #dc2626;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --surface: #1e2128; --text: #e8eaed; --muted: #9aa0aa;
        --border: #2c3038; --accent: #3b82f6;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card {
      height: 100%; display: flex; flex-direction: column;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.22);
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px 8px 12px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag; user-select: none;
    }
    header h1 { font-size: 13px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
    header .sub { font-size: 11px; color: var(--muted); margin-left: 2px; }
    header button { -webkit-app-region: no-drag; }
    .sp { flex: 1; }
    textarea {
      flex: 1; width: 100%; border: 0; resize: none; padding: 10px 12px;
      background: transparent; color: inherit; font: 13.5px/1.45 -apple-system, "Segoe UI", sans-serif;
      outline: none;
    }
    footer {
      display: flex; gap: 8px; padding: 8px 10px;
      border-top: 1px solid var(--border);
    }
    button {
      appearance: none; border: 1px solid var(--border); background: transparent;
      color: var(--accent); font: 600 12px -apple-system, "Segoe UI", sans-serif;
      padding: 5px 10px; border-radius: 7px; cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
    button.danger { color: var(--danger); }
    button.ico { padding: 4px 8px; font-size: 14px; line-height: 1; color: var(--muted); }
    button.ico:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Scratchpad</h1>
      <span class="sub" id="brandSub">FlowRad Dictate</span>
      <span class="sp"></span>
      <button class="ico" id="hide" title="Hide">–</button>
    </header>
    <textarea id="pad" spellcheck="true" placeholder="Dictated text lands here. Edit freely, then type it into the focused app."></textarea>
    <footer>
      <button class="primary" id="type">Type into app</button>
      <button id="copy">Copy</button>
      <span class="sp"></span>
      <button class="danger" id="clear">Clear</button>
    </footer>
  </div>
  <script src="./scratchpad.js"></script>
</body>
</html>
