<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; user-select: none; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Dead simple: black when idle, red when recording. No animations. */
    .orb {
      -webkit-app-region: no-drag; cursor: pointer;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #111318; box-shadow: 0 6px 20px rgba(0,0,0,.45);
      transition: background .12s linear;
    }
    .orb svg { width: 24px; height: 24px; fill: #fff; opacity: .92; }
    body.rec .orb { background: #ef4444; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb" id="orb" title="Dictate (Alt+Q)">

    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
