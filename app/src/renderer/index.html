<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; user-select: none; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Idle = black, recording = red (solid, no animation). Processing states
       (transcribing / cleaning / downloading) tint the orb and show a single
       smooth rotating arc — a calm "working" cue, not the old colour flicker. */
    .orb {
      position: relative;
      -webkit-app-region: no-drag; cursor: pointer;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #111318; box-shadow: 0 6px 20px rgba(0,0,0,.45);
      transition: background .15s linear;
    }
    .orb svg { width: 24px; height: 24px; fill: #fff; opacity: .92; z-index: 1; }
    /* processing arc, hidden unless a processing class is set */
    .ring {
      position: absolute; inset: -5px; border-radius: 50%;
      border: 2px solid transparent; opacity: 0; box-sizing: border-box;
    }
    body.rec .orb { background: #ef4444; }
    body.transcribing .orb { background: #f59e0b; }   /* amber: transcribing */
    body.cleaning .orb { background: #3b82f6; }         /* blue: cleaning */
    body.downloading .orb { background: #6b7280; }      /* grey: downloading */
    body.transcribing .ring { opacity: 1; border-top-color: #fcd34d; animation: spin 1.1s linear infinite; }
    body.cleaning .ring { opacity: 1; border-top-color: #93c5fd; animation: spin 1.1s linear infinite; }
    body.downloading .ring { opacity: 1; border-top-color: #d1d5db; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* tiny label under the orb (e.g. "Cleaning…", "42%") — no layout shift */
    .cap {
      position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
      font: 600 10px -apple-system, "Segoe UI", sans-serif; color: #e5e7eb;
      text-shadow: 0 1px 2px rgba(0,0,0,.6); opacity: 0; transition: opacity .15s;
      pointer-events: none;
    }
    body.transcribing .cap, body.cleaning .cap, body.downloading .cap { opacity: .95; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb" id="orb" title="Dictate (Alt+Q)">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21a1 1 0 1 1-2 0v-3.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/></svg>
    </div>
  </div>
  <div class="cap" id="cap"></div>
  <script src="./renderer.js"></script>
</body>
</html>
