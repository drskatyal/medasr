<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; user-select: none; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
    .bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px 8px 12px;
      border-radius: 28px;
      background: rgba(17, 19, 24, .92);
      box-shadow: 0 8px 28px rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
      -webkit-app-region: no-drag;
    }
    .btn {
      appearance: none; border: 0; cursor: pointer;
      height: 32px; padding: 0 12px; border-radius: 16px;
      font: 650 11px/1 -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .02em; text-transform: uppercase;
      color: #e8eaed; background: #2a2e36;
      transition: background .12s linear, color .12s linear;
    }
    .btn:hover { background: #353a44; }
    .btn.hold.armed, body.rec .btn.hold { background: #ef4444; color: #fff; }
    .btn.tog { background: #2563eb; color: #fff; }
    .btn.tog:hover { background: #1d4ed8; }
    body.rec .btn.tog { background: #4b5563; }
    .btn.pad { padding: 0 10px; background: transparent; color: #c5cad3; font-size: 13px;
      text-transform: none; letter-spacing: 0; height: 28px; }
    .btn.pad:hover { background: #2a2e36; color: #fff; }
    /* Idle = black, recording = red (solid, no animation). Processing states
       (transcribing / cleaning / downloading) tint the orb and show a single
       smooth rotating arc — a calm "working" cue, not the old colour flicker. */
    .orb {
      position: relative;
      cursor: pointer;
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #111318; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      transition: background .15s linear; flex: none;
    }
    .orb svg { width: 22px; height: 22px; fill: #fff; opacity: .92; z-index: 1; }
    .ring {
      position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid transparent; opacity: 0; box-sizing: border-box;
    }
    body.rec .orb { background: #ef4444; }
    body.transcribing .orb { background: #f59e0b; }
    body.cleaning .orb { background: #3b82f6; }
    body.downloading .orb { background: #6b7280; }
    body.transcribing .ring { opacity: 1; border-top-color: #fcd34d; animation: spin 1.1s linear infinite; }
    body.cleaning .ring { opacity: 1; border-top-color: #93c5fd; animation: spin 1.1s linear infinite; }
    body.downloading .ring { opacity: 1; border-top-color: #d1d5db; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cap {
      position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
      font: 600 10px -apple-system, "Segoe UI", sans-serif; color: #e5e7eb;
      text-shadow: 0 1px 2px rgba(0,0,0,.6); opacity: 0; transition: opacity .15s;
      pointer-events: none;
    }
    body.transcribing .cap, body.cleaning .cap, body.downloading .cap { opacity: .95; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar" id="bar">
      <button type="button" class="btn hold" id="btnHold" title="Hold to talk">Hold</button>
      <div class="orb" id="orb" title="Toggle dictation">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21a1 1 0 1 1-2 0v-3.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/></svg>
      </div>
      <button type="button" class="btn tog" id="btnToggle" title="Toggle dictation">Toggle</button>
      <button type="button" class="btn pad" id="btnPad" title="Scratchpad">Pad</button>
    </div>
  </div>
  <div class="cap" id="cap"></div>
  <script src="./renderer.js"></script>
</body>
</html>
